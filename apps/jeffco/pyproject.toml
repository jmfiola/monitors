[project]
name = "jeffco"
version = "2.0.0"
description = "Jeffco substitute-job monitor"
requires-python = ">=3.13"
dependencies = ["monitor", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeffco"]

[tool.uv.sources]
monitor = { workspace = true }
